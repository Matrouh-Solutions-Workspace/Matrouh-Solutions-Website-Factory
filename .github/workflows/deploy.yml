name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure the deployment key
        env:
          DEPLOY_KEY: ${{ secrets.MPORTFOLIO_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.MPORTFOLIO_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload and activate the release
        env:
          DEPLOY_HOST: ${{ secrets.MPORTFOLIO_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.MPORTFOLIO_SSH_USER }}
          RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
        run: |
          git archive --format=tar.gz --output="$RELEASE_ID.tgz" HEAD
          scp "$RELEASE_ID.tgz" "$DEPLOY_USER@$DEPLOY_HOST:/opt/mportfolio/incoming/$RELEASE_ID.tgz"
          scp scripts/production/deploy-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/mportfolio/incoming/$RELEASE_ID.deploy"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/bin/install -D -o root -g root -m 0755 /opt/mportfolio/incoming/$RELEASE_ID.deploy /usr/local/sbin/mportfolio-deploy && sudo /usr/local/sbin/mportfolio-deploy $RELEASE_ID"
