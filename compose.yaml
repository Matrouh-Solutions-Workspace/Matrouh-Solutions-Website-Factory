services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_USER: factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - factory-postgres-data:/var/lib/postgresql/data

volumes:
  factory-postgres-data:
